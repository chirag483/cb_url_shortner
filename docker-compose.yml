services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      URLSHORT_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-urlshortener}
      URLSHORT_BASE_URL: ${BASE_URL:-http://localhost:8000}
      URLSHORT_SHORT_CODE_LENGTH: ${SHORT_CODE_LENGTH:-7}
      URLSHORT_UNLOGGED_TABLE: ${UNLOGGED_TABLE:-true}
      URLSHORT_CACHE_MAX_SIZE: ${CACHE_MAX_SIZE:-10000}
      URLSHORT_HIT_FLUSH_INTERVAL_SECONDS: ${HIT_FLUSH_INTERVAL_SECONDS:-2.0}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
